- titre: "🥊 MMA & Compétition"
  description: "Je suis actuellement pratiquant de MMA et en préparation active pour mes premiers combats amateurs. Le combat en cage exige une discipline de fer, une résistance au stress et une volonté d'apprendre de chaque échange. Ce mental d'acier est la fondation de tout ce que j'entreprends, que ce soit dans la cage ou dans le monde des affaires."

- titre: "🛠️ Tech, Électricité & Business"
  description: "J'associe le monde du concret et du numérique pour créer mes propres opportunités :
  - Informatique : Développement, création de solutions digitales et automatisation.
  - Électricité : Compétences techniques du terrain et gestion des installations.

  Actuellement, je développe des projets et lance des micro-business en m'appuyant sur cette double compétence. Mon approche : tester vite, apprendre vite, délivrer de la valeur."
